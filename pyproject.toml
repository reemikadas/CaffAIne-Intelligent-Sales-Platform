[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "caffaine-intelligent-sales-platform"
version = "0.1.0"
description = "Coffee shop sales intelligence platform built with Databricks and medallion architecture."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2.2,<3.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]